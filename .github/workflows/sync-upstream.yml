name: Sync SuiteSparse CAMD

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: SuiteSparse branch or tag
        required: false
        default: dev

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-suitesparse-camd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: automation/sync-suitesparse-camd
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream files
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: ./scripts/sync-upstream.sh "${REQUESTED_REF:-dev}"
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Publish sync pull request
        run: |
          changes=$(git status --porcelain -- UPSTREAM LICENSE include/camd.h include/SuiteSparse_config_version.h src/upstream tests/upstream)
          if [ -z "$changes" ]; then
            echo "Already synchronized."
            exit 0
          fi
          source UPSTREAM
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          git add UPSTREAM LICENSE include/camd.h include/SuiteSparse_config_version.h src/upstream tests/upstream
          git commit -m "Sync CAMD from SuiteSparse ${commit:0:12}"
          git push --force-with-lease origin "HEAD:$SYNC_BRANCH"
          pr_url=$(gh pr list --state open --head "$SYNC_BRANCH" \
            --json url --jq '.[0].url')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$SYNC_BRANCH" \
              --title "Sync CAMD from SuiteSparse ${commit:0:12}" \
              --body "Automated CAMD sync from SuiteSparse commit \`$commit\` ($commit_date).")
          fi
          gh pr edit "$pr_url" \
            --title "Sync CAMD from SuiteSparse ${commit:0:12}" \
            --body "Automated CAMD sync from SuiteSparse commit \`$commit\` ($commit_date)."
          head_sha=$(git rev-parse HEAD)
          for attempt in {1..12}; do
            pr_head=$(gh pr view "$pr_url" --json headRefOid --jq .headRefOid)
            if [ "$pr_head" = "$head_sha" ]; then
              break
            fi
            sleep 5
          done
          if [ "$pr_head" != "$head_sha" ]; then
            echo "Pull request head did not update to $head_sha." >&2
            exit 1
          fi
          gh workflow run ci.yml --ref "$SYNC_BRANCH"
          gh pr merge "$pr_url" \
            --auto \
            --squash \
            --delete-branch \
            --match-head-commit "$head_sha"
